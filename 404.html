<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Riverwood Trails HOA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
  :root{
    --forest: #16301f;
    --forest-deep: #0e1d14;
    --river: #2f7a44;
    --clay: #2f7a44;
    --cream: #eaf1ea;
    --paper: #ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--paper);
    color:#22221f;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:6vw;
    text-align:center;
  }
  .wrap{max-width:480px;}
  .mark{
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(135deg, var(--forest) 0%, var(--forest-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 28px;
  }
  .mark svg{width:34px; height:34px;}
  h1{
    font-family:'Manrope', sans-serif; font-weight:800; letter-spacing:-.02em;
    font-size:1.8rem; color:var(--forest-deep);
    margin-bottom:12px;
  }
  p{color:#4a4a43; font-size:1rem; line-height:1.6; margin-bottom:28px;}
  a.btn{
    display:inline-block;
    background:var(--forest); color:var(--cream);
    padding:13px 26px; border-radius:2px;
    text-decoration:none; font-size:.9rem; font-weight:500;
    letter-spacing:.03em;
    transition:background .2s ease, transform .2s ease;
  }
  a.btn:hover{background:var(--forest-deep); transform:translateY(-1px);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 8c1.5 1.6 3 1.6 4.5 0s3-1.6 4.5 0 3 1.6 4.5 0 3-1.6 4.5 0" stroke="#f4efe4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 13c1.5 1.6 3 1.6 4.5 0s3-1.6 4.5 0 3 1.6 4.5 0 3-1.6 4.5 0" stroke="#f4efe4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
        <path d="M2 18c1.5 1.6 3 1.6 4.5 0s3-1.6 4.5 0 3 1.6 4.5 0 3-1.6 4.5 0" stroke="#f4efe4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
      </svg>
    </div>
    <h1>Looks like this page washed downstream</h1>
    <p>The page you're looking for doesn't exist — it may have moved, or the link might have a typo. Let's get you back on the trail.</p>
    <a class="btn" href="./index.html">Back to Riverwood Trails</a>
  </div>
</body>
</html>
